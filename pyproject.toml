[project]
name = "czech-wn"
version = "2.2"
description = "Czech WordNet: the DEBVisDic sources, their conversion to WN-LMF, and the changes since"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "wn>=1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
